name: Deploy Admin to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Enable workers.dev route
        run: |
          cd .output/server
          node -e "
            const cfg = JSON.parse(require('fs').readFileSync('wrangler.json','utf8'));
            cfg.workers_dev = true;
            require('fs').writeFileSync('wrangler.json', JSON.stringify(cfg, null, 2));
          "

      - name: Deploy to Cloudflare Workers
        working-directory: .output/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 deploy --config wrangler.json
